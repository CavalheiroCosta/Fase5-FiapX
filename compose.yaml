services:
  postgres-usuarios:
    image: postgres:16
    environment:
      POSTGRES_DB: fiapx_usuarios
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    ports:
      - "5432:5432"
    volumes:
      - fiapx_usuarios:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: src/Auth/Api/Dockerfile
    ports:
      - "5298:8080"
    environment:
      ConnectionStrings__Usuarios: Host=postgres-usuarios;Port=5432;Database=fiapx_usuarios;Username=fiapx;Password=fiapx
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  postgres-videos:
    image: postgres:16
    environment:
      POSTGRES_DB: fiapx_videos
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    ports:
      - "5433:5432"
    volumes:
      - fiapx_videos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_videos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fiapx
      MINIO_ROOT_PASSWORD: fiapxfiapx
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fiapx_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: fiapx
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  video:
    build:
      context: .
      dockerfile: src/Video/Api/Dockerfile
    ports:
      - "5299:8080"
    environment:
      Persistence__Provider: Postgres
      ConnectionStrings__Videos: Host=postgres-videos;Port=5432;Database=fiapx_videos;Username=fiapx;Password=fiapx
      Storage__ServiceUrl: http://minio:9000
      Storage__Bucket: videos
      Storage__AccessKey: fiapx
      Storage__SecretKey: fiapxfiapx
      Queue__Uri: amqp://fiapx:fiapx@rabbitmq:5672/
      Queue__Nome: processamento
      Token__Chave: fiapx-auth-chave-local-desenvolvimento
      Upload__LimiteBytes: "209715200"
    depends_on:
      postgres-videos:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  fiapx_usuarios:
  fiapx_videos:
  fiapx_minio:
