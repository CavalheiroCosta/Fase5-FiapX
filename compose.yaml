services:
  postgres-usuarios:
    image: postgres:16
    environment:
      POSTGRES_DB: fiapx_usuarios
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    ports:
      - "5432:5432"
    volumes:
      - fiapx_usuarios:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: src/Auth/Api/Dockerfile
    ports:
      - "5298:8080"
    environment:
      ConnectionStrings__Usuarios: Host=postgres-usuarios;Port=5432;Database=fiapx_usuarios;Username=fiapx;Password=fiapx
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  postgres-videos:
    image: postgres:16
    environment:
      POSTGRES_DB: fiapx_videos
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    ports:
      - "5433:5432"
    volumes:
      - fiapx_videos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_videos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fiapx
      MINIO_ROOT_PASSWORD: fiapxfiapx # NOSONAR credencial só do ambiente local
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fiapx_minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: fiapx
    volumes:
      - ./compose/monitoramento/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  video:
    build:
      context: .
      dockerfile: src/Video/Api/Dockerfile
    ports:
      - "5299:8080"
    environment:
      Persistence__Provider: Postgres
      ConnectionStrings__Videos: Host=postgres-videos;Port=5432;Database=fiapx_videos;Username=fiapx;Password=fiapx
      Storage__ServiceUrl: http://minio:9000
      Storage__Bucket: videos
      Storage__AccessKey: fiapx
      Storage__SecretKey: fiapxfiapx
      Queue__Uri: amqp://fiapx:fiapx@rabbitmq:5672/
      Queue__Nome: processamento
      Token__Chave: fiapx-auth-chave-local-desenvolvimento
      Upload__LimiteBytes: "209715200"
    depends_on:
      postgres-videos:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "fiapx"]
    ports:
      - "6379:6379"
    volumes:
      - fiapx_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fiapx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  processor:
    build:
      context: .
      dockerfile: src/Processor/Api/Dockerfile
    ports:
      - "5300:8080"
    environment:
      Storage__ServiceUrl: http://minio:9000
      Storage__Bucket: videos
      Storage__AccessKey: fiapx
      Storage__SecretKey: fiapxfiapx
      Queue__Uri: amqp://fiapx:fiapx@rabbitmq:5672/
      Queue__Processamento: processamento
      Queue__Status: status
      Redis__Conexao: redis:6379,password=fiapx
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-exporter-usuarios:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres-usuarios:5432/fiapx_usuarios?sslmode=disable
      DATA_SOURCE_USER: fiapx
      DATA_SOURCE_PASS: fiapx # NOSONAR credencial só do ambiente local
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  postgres-exporter-videos:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres-videos:5432/fiapx_videos?sslmode=disable
      DATA_SOURCE_USER: fiapx
      DATA_SOURCE_PASS: fiapx # NOSONAR credencial só do ambiente local
    depends_on:
      postgres-videos:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: fiapx # NOSONAR credencial só do ambiente local
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./compose/monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      auth:
        condition: service_started
      video:
        condition: service_started
      postgres-exporter-usuarios:
        condition: service_started
      postgres-exporter-videos:
        condition: service_started
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      processor:
        condition: service_started
      redis-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:13.0.9
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: fiapx
      GF_SECURITY_ADMIN_PASSWORD: fiapx # NOSONAR credencial só do ambiente local
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fiapx.json
    volumes:
      - ./compose/monitoramento/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/monitoramento/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  fiapx_usuarios:
  fiapx_videos:
  fiapx_minio:
  fiapx_redis:
