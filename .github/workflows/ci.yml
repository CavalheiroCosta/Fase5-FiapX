name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  SOLUTION: Fase5-FiapX.slnx
  AUTH_TEST_PROJECT: tst/Auth/Tests/Auth.Tests.csproj
  COVERAGE_DIR: ${{ github.workspace }}/coverage

jobs:
  ci:
    name: Restore, build e cobertura da Auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Testes da Auth com OpenCover
        run: |
          dotnet test "${{ env.AUTH_TEST_PROJECT }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ env.COVERAGE_DIR }}" \
            -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Falha se a cobertura de linhas da Auth for menor que 80%
        shell: pwsh
        run: ./.github/scripts/check-auth-coverage.ps1 -CoverageDir "${{ env.COVERAGE_DIR }}"
